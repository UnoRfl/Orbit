<script>
/* ============================================================
   Clickjacking. The CSP above would normally say frame-ancestors
   'none', but that directive is IGNORED when a policy arrives in a
   meta tag, and GitHub Pages cannot send a real header — so the
   only place left to refuse being framed is here. Hide first, then
   try to break out: a sandboxed frame can block the navigation but
   cannot stop us blanking the page inside it.
   ============================================================ */
(function(){
  try {
    if (window.top === window.self) return;
    document.documentElement.style.visibility = 'hidden';
    window.top.location = window.self.location.href;   // may throw cross-origin
  } catch (e) { /* framed and unable to escape — staying hidden is the answer */ }
})();

/* ============================================================
   Device tier — decided BEFORE first paint so CSS can gate glass,
   3D and motion immediately instead of flashing the heavy version.
     data-perf   0 = full · 1 = lite (phones / mid) · 2 = min (low-end)
     data-coarse touch pointer (no hover, no cursor glow)
     data-rm     the OS asked for reduced motion
   main.js can step data-perf DOWN at runtime if a device still can't
   hold framerate; everything keyed off it follows automatically.
   ============================================================ */
(function(){
  var d = document.documentElement, t = 0;
  try {
    var coarse = matchMedia('(pointer:coarse)').matches;
    var mem    = navigator.deviceMemory || 8;          // undefined on iOS -> 8
    var cpu    = navigator.hardwareConcurrency || 8;
    var small  = Math.min(innerWidth || 9999, (screen && screen.width) || 9999) < 760;
    if (coarse || small) t = 1;
    if ((mem <= 4 && cpu <= 4) || (coarse && mem <= 4)) t = 2;
    if (coarse) d.setAttribute('data-coarse', '1');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.setAttribute('data-rm', '1');
    if (!(window.CSS && CSS.supports && (CSS.supports('backdrop-filter','blur(2px)') || CSS.supports('-webkit-backdrop-filter','blur(2px)')))) d.setAttribute('data-noglass','1');
  } catch (e) {}
  d.setAttribute('data-perf', String(t));
  /* data-perf0 is the tier as measured at boot and is NEVER changed afterwards.
     data-perf can be stepped DOWN at runtime when the ambient canvas can't hold
     framerate — that should lower visual quality, but it must not remove whole
     features, or a brief stutter makes the map option vanish mid-session. */
  d.setAttribute('data-perf0', String(t));
})();
</script>
